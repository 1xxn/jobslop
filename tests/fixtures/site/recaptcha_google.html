<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Platform Engineer – Captcha GmbH</title><script src="https://www.google.com/recaptcha/api.js" async defer></script></head>
<body>
<!-- Echtes reCAPTCHA-Widget mit Googles offiziellem Test-Schlüssel (besteht immer, nur für Tests gedacht: https://developers.google.com/recaptcha/docs/faq). Braucht Netz. -->
<h1>Platform Engineer</h1>
<form id="f">
  <label for="first_name">First Name *</label> <input id="first_name" name="first_name" required>
  <label for="last_name">Last Name *</label> <input id="last_name" name="last_name" required>
  <label for="email">Email *</label> <input id="email" name="email" type="email" required>
  <div class="g-recaptcha" data-sitekey="6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI"></div>
  <p id="err" role="alert"></p>
  <button type="submit">Submit application</button>
</form>
<script>
  document.getElementById("f").addEventListener("submit", async (e) => {
    e.preventDefault();
    const token = (document.querySelector('[name="g-recaptcha-response"]') || {}).value;
    if (!token) { document.getElementById("err").textContent = "Please complete the captcha."; return; }
    const data = Object.fromEntries(new FormData(e.target));
    delete data["g-recaptcha-response"];
    await fetch("/submit", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(data)});
    document.body.innerHTML = "<h1>Thank you for applying!</h1><p>Application submitted.</p>";
  });
</script>
</body>
</html>
