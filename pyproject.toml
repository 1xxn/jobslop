[project]
name = "jobpilot"
version = "1.0.0"
description = "Lokaler Bewerbungs-Autopilot: Jobs crawlen, bewerten und Bewerbungsformulare mit Playwright und Claude ausfüllen."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Max Mustermann" }]
dependencies = [
    "anthropic>=2.0",
    "playwright>=1.50",
    "typer>=0.15",
    "rich>=13.9",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "httpx>=0.28",
    "tenacity>=9.0",
    "pyyaml>=6.0.2",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.18",
    "pillow>=11.0",
]

[project.scripts]
jobpilot = "jobpilot.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobpilot"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["browser: Tests, die einen echten Chromium starten"]
