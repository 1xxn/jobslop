[project]
name = "jobslop"
version = "1.0.0"
description = "Local, AI-driven job application autopilot: finds jobs, ranks them against your profile and fills out application forms in a real browser – powered by your own Claude subscription."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "1xxn" }]
keywords = ["job-search", "automation", "playwright", "claude", "ai-agent", "job-application"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Office/Business",
]
dependencies = [
    "playwright>=1.64",
    "typer>=0.27",
    "rich>=15.0",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "sqlalchemy>=2.1.6",
    "httpx>=0.28",
    "tenacity>=9.2",
    "pyyaml>=6.0.3",
    "tomli-w>=1.2",
    "fastapi>=0.162",
    "uvicorn>=0.54",
    "python-multipart>=0.0.32",
    "pillow>=13.0",
    "pypdf>=6.21.4",
    # LinkedIn, Indeed, Glassdoor (öffentliche Suche) – MIT, https://github.com/speedyapply/JobSpy
    "python-jobspy>=1.4.1,<2",
    # App-Passwort des Postfachs im Schlüsselbund (Windows, macOS, Secret Service) – MIT
    "keyring>=25.7",
]

[project.urls]
Homepage = "https://github.com/1xxn/jobslop"
Issues = "https://github.com/1xxn/jobslop/issues"

[project.scripts]
jobslop = "jobslop.cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.16",  # Starlette-TestClient: mit httpx ist er veraltet
    "mypy>=2.4.1",
    "pytest>=9.2",
    "pytest-asyncio>=1.4",
    "respx>=0.23",
    "ruff>=0.17.3",
]

[build-system]
requires = ["hatchling>=1.33"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobslop"]
# Die gebaute Oberfläche (frontend/ → src/jobslop/web/dist) gehört ins Paket
artifacts = ["src/jobslop/web/dist/**"]

[tool.hatch.build.targets.sdist]
exclude = ["frontend/node_modules", "docs/screenshots"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["frontend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC", "RUF", "S"]
# S603: jeder subprocess-Aufruf – jobslop startet nur Argumentlisten ohne Shell (S602/S604/S605 bleiben an)
ignore = ["E501", "RUF001", "RUF002", "RUF003", "B008", "S603"]

[tool.ruff.lint.per-file-ignores]
# Tests: assert ist das Werkzeug, Testpasswörter sind erfunden, Hilfsprozesse kommen aus dem PATH
"tests/**" = ["S101", "S104", "S105", "S106", "S311", "S607"]
# Messrahmen und Demo-Daten: erfundene Zufallsdaten, lokale Werkzeuge (npm, ps)
"scripts/**" = ["S311", "S607"]
# httpcore schreibt die Signatur von connect_tcp vor (timeout-Parameter)
"src/jobslop/netguard.py" = ["ASYNC109"]

[tool.mypy]
# Standardmodus: fängt falsche Typen an Schnittstellen (Literal-Werte, None, Rückgaben), ohne jede Funktion zu verlangen
python_version = "3.12"
files = ["src/jobslop"]
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "browser: Tests, die einen echten Chromium starten",
    "live: Tests, die das echte Claude Code aufrufen (Abo-Kontingent; nur mit JOBSLOP_LIVE=1)",
    "network: Tests gegen echte Seiten (nur lesen; nur mit JOBSLOP_NETWORK=1)",
]
