<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}jobpilot{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --ink:#14202C; --muted:#5A6774; --line:#D9E0E7; --soft:#E9EEF4;
  --accent:#1B5C9E; --accent-ink:#FFFFFF; --ok:#157A3C; --warn:#9A5B06; --bad:#B42318;
  --sre:#B8420D; --platform:#2347C5; --devops:#0B7454; --cloud:#0C6E86; --system:#6D2BA3; --other:#5A6774;
  --sans:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0E141A; --surface:#151D25; --ink:#E4EAF0; --muted:#97A4B1; --line:#25313C; --soft:#1A2530;
  --accent:#78AEEA; --accent-ink:#0E141A; --ok:#5BD08A; --warn:#E7B04F; --bad:#F38B80;
  --sre:#F08A5D; --platform:#8EA8FA; --devops:#4CCB93; --cloud:#4CC9E4; --system:#C79BF2; --other:#97A4B1; color-scheme:dark;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans)}
a{color:var(--accent)}
header.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.bar{max-width:1280px;margin:0 auto;padding:10px 20px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.brand{font-family:var(--mono);font-weight:500;letter-spacing:.02em;text-decoration:none;color:var(--ink)}
.brand b{color:var(--accent)}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{text-decoration:none;color:var(--muted);padding:5px 10px;border-radius:6px;font-size:.92rem}
nav a.on,nav a:hover{background:var(--soft);color:var(--ink)}
.live{margin-left:auto;display:flex;gap:10px;align-items:center;font-family:var(--mono);font-size:.78rem;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);display:inline-block;margin-right:5px}
.dot.on{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 25%,transparent)}
.badge-alert{background:var(--warn);color:#fff;border-radius:999px;padding:1px 8px;font-weight:600;text-decoration:none}
main{max-width:1280px;margin:0 auto;padding:24px 20px 60px;display:grid;gap:22px}
h1{font-size:1.6rem;margin:0;letter-spacing:-.01em}
h2{font-size:1.05rem;margin:0}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-size:.82rem}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px 18px;display:grid;gap:10px;align-content:start;min-width:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.stat{background:var(--surface);padding:12px 14px}
.stat b{display:block;font-family:var(--mono);font-size:1.5rem;font-weight:500;font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--muted)}
table{width:100%;border-collapse:collapse;background:var(--surface)}
.tablewrap{border:1px solid var(--line);border-radius:8px;overflow-x:auto;background:var(--surface)}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top;font-size:.9rem}
th{font-family:var(--mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500;background:var(--soft)}
tr:last-child td{border-bottom:0}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{font-family:var(--mono);font-size:.72rem;font-weight:500;padding:1px 7px;border-radius:4px;border:1px solid currentColor;white-space:nowrap;display:inline-block}
.k-SRE{color:var(--sre)}.k-Platform{color:var(--platform)}.k-DevOps{color:var(--devops)}.k-Cloud{color:var(--cloud)}.k-System{color:var(--system)}.k-Other{color:var(--other)}
.s-submitted,.s-manual,.s-interview,.s-offer{color:var(--ok)}
.s-needs_input,.s-needs_review,.s-paused{color:var(--warn)}
.s-failed{color:var(--bad)}
.s-running,.s-ready{color:var(--accent)}
.s-rejected,.s-skipped{color:var(--muted)}
.fit i{display:inline-block;width:7px;height:7px;border-radius:2px;background:var(--line);margin-right:2px}
.fit i.on{background:var(--accent)}
form.inline{display:inline}
button,.btn{font:inherit;font-size:.85rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:4px 10px;cursor:pointer;text-decoration:none;display:inline-block}
button:hover,.btn:hover{border-color:var(--accent)}
button.primary,.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.danger{color:var(--bad)}
input,select,textarea{font:inherit;font-size:.9rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 8px;max-width:100%}
textarea{width:100%;min-height:70px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.prompt{border:1px solid var(--warn);border-left-width:4px}
pre.log{background:var(--soft);border-radius:6px;padding:10px;font:12px/1.45 var(--mono);white-space:pre-wrap;max-height:320px;overflow:auto;margin:0}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.shots a{display:block;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--soft)}
.shots img{width:100%;display:block}
.shots span{display:block;font:11px var(--mono);padding:4px 6px;color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<header class="top"><div class="bar">
  <a class="brand" href="/">job<b>pilot</b></a>
  <nav>
    {% set p = request.url.path %}
    <a href="/" class="{{ 'on' if p == '/' }}">Übersicht</a>
    <a href="/jobs" class="{{ 'on' if p.startswith('/jobs') }}">Stellen</a>
    <a href="/applications" class="{{ 'on' if p.startswith('/applications') }}">Bewerbungen</a>
    <a href="/crawls" class="{{ 'on' if p.startswith('/crawls') }}">Crawl-History</a>
    <a href="/answers" class="{{ 'on' if p.startswith('/answers') }}">Antwortbank</a>
    <a href="/exclusions" class="{{ 'on' if p.startswith('/exclusions') }}">Ausschlüsse</a>
  </nav>
  <div class="live" id="live">
    <span><span class="dot {{ 'on' if runner_active }}" id="dot-runner"></span>Bewerber</span>
    <span><span class="dot {{ 'on' if crawl_running }}" id="dot-crawl"></span>Crawler</span>
    <a class="badge-alert" id="prompt-badge" href="/#rueckfragen" {% if not open_prompts %}hidden{% endif %}>{{ open_prompts }} Rückfrage(n)</a>
  </div>
</div></header>
<main>{% block content %}{% endblock %}</main>
<script>
// Leichtgewichtiges Polling: zeigt neue Rückfragen sofort an.
(function(){
  let known = {{ open_prompts }};
  async function tick(){
    try{
      const r = await fetch('/api/prompts'); const d = await r.json();
      document.getElementById('dot-runner').classList.toggle('on', d.runner);
      document.getElementById('dot-crawl').classList.toggle('on', d.crawl);
      const b = document.getElementById('prompt-badge');
      b.hidden = d.open.length === 0; b.textContent = d.open.length + ' Rückfrage(n)';
      if (d.open.length > known && location.pathname === '/') location.reload();
      known = d.open.length;
    }catch(e){}
  }
  setInterval(tick, 3000);
})();
</script>
</body>
</html>
