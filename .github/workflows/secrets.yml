name: Secrets

# Gitleaks sucht Zugangsdaten auch mit allgemeinen Mustern (Passwörter, Tokens), die GitHubs Secret Scanning nicht
# kennt. Pull Requests: nur deren Commits; geplant und von Hand: die ganze Historie.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "11 6 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # Historie lesen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }} # nur lesend: Commits eines Pull Requests auflisten
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false" # ein Fund steht im Log – kein Artefakt mit dem Geheimnis
