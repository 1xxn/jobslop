name: Release

# Ein Tag wie v1.1.0 auf main: alle CI-Prüfungen laufen erneut, dann werden Wheel und sdist gebaut und als
# GitHub-Release mit dem passenden Abschnitt aus CHANGELOG.md veröffentlicht. Ablauf: CONTRIBUTING.md → Releasing.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Tag, pyproject.toml and frontend/package.json must agree
        run: |
          tag="${GITHUB_REF_NAME#v}"
          py=$(uv run --no-project python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          js=$(uv run --no-project python -c "import json; print(json.load(open('frontend/package.json'))['version'])")
          echo "tag=$tag pyproject=$py package.json=$js"
          if [ "$tag" != "$py" ] || [ "$tag" != "$js" ]; then
            echo "::error::Version mismatch – bump pyproject.toml and frontend/package.json to $tag"
            exit 1
          fi

      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## " v "( |$)" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section '## $version'"
            exit 1
          fi

      - name: Build wheel and sdist
        run: uv build

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "jobslop $GITHUB_REF_NAME" --notes-file notes.md --verify-tag
