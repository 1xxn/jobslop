name: Release

# Ein Tag wie v1.1.0 auf main: alle CI-Prüfungen laufen erneut, dann werden Wheel und sdist gebaut und als
# GitHub-Release mit dem passenden Abschnitt aus CHANGELOG.md veröffentlicht. Ablauf: CONTRIBUTING.md → Releasing.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository] – „$/“ erst seit 07/2026, Release-Pfad bleibt beim erprobten Weg

  release:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write # Build-Herkunft (Sigstore) für die Attestierung
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"

      - name: Tag, pyproject.toml and frontend/package.json must agree
        run: |
          tag="${GITHUB_REF_NAME#v}"
          py=$(uv run --no-project python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          js=$(uv run --no-project python -c "import json; print(json.load(open('frontend/package.json'))['version'])")
          echo "tag=$tag pyproject=$py package.json=$js"
          if [ "$tag" != "$py" ] || [ "$tag" != "$js" ]; then
            echo "::error::Version mismatch – bump pyproject.toml and frontend/package.json to $tag"
            exit 1
          fi

      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## " v "( |$)" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section '## $version'"
            exit 1
          fi

      - name: Build wheel and sdist
        run: uv build

      # Nachweis, dass Wheel und sdist aus genau diesem Tag in diesem Workflow gebaut wurden:
      # gh attestation verify dist/<datei> --repo 1xxn/jobslop
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "jobslop $GITHUB_REF_NAME" --notes-file notes.md --verify-tag
