name: CodeQL

# Statische Sicherheitsanalyse für Python, TypeScript/JavaScript (Dashboard und Browser-Erweiterung) und die
# Workflows selbst. Ergebnisse erscheinen unter Security → Code scanning.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1" # montags, damit neue Abfragen auch ohne Commit greifen
  workflow_dispatch:

permissions: {}

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # Quellen auschecken
      security-events: write # Ergebnisse in Code scanning hochladen
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          # Die gebaute Oberfläche ist generierter Code – analysiert werden die Quellen in frontend/
          config: |
            paths-ignore:
              - src/jobslop/web/dist
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
