name: Job sources

# Wöchentlicher Gesundheitscheck gegen echte Jobbörsen und Formulare (tests/test_real_sites.py): bemerkt, wenn
# eine Quelle ihr Format ändert, bevor es Nutzer tun. Liest nur – nichts wird ausgefüllt oder abgeschickt.
on:
  schedule:
    - cron: "40 5 * * 3" # mittwochs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Real sites
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JOBSLOP_NETWORK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run playwright install --with-deps chromium
      - name: Read real sources and forms, real reCAPTCHA widget (Google test key)
        run: uv run pytest -m network -v
